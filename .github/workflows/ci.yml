name: Foundation checks

on:
  push:
    branches: [master, 'feature/**', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run baseline validation
        run: npm run setup
      - name: Install pinned Chromium for native template regression tests
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Render native slideshow and preserve SPX HTML/OGraf lifecycle
        run: npm run test:browser
      - name: Retain native template browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-template-browser-${{ runner.os }}
          path: build/browser-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise off-air loopback RossTalk transport bench
        run: npm run bench:rosstalk
      - name: Upload verified Windows containment helper (component only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-job-host
          path: build/windows/PiRaiders.JobHost.exe
          if-no-files-found: error
          retention-days: 14
      - name: Build portable Windows development bundle
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Verify extracted archive and actual launcher
        if: runner.os == 'Windows'
        run: npm run smoke:windows-package
      - name: Upload Windows development ZIP (not a user-testable release)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: piraiders-windows-development
          path: |
            build/windows/PiRaiders-Development-win-x64.zip
            build/windows/PiRaiders-Development-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
