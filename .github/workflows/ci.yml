name: Foundation checks

on:
  push:
    branches: [master, 'feature/**', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run baseline validation
        run: npm run setup
      - name: Upload verified Windows containment helper (component only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-job-host
          path: build/windows/PiRaiders.JobHost.exe
          if-no-files-found: error
          retention-days: 14
