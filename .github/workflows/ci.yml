name: Foundation checks

on:
  push:
    branches: [master, 'feature/**', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run baseline validation
        run: npm run setup
      - name: Install pinned Chromium for native template regression tests
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Render native slideshow and preserve SPX HTML/OGraf lifecycle
        run: npm run test:browser
      - name: Retain native template browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-template-browser-${{ runner.os }}
          path: |
            build/browser-artifacts
            build/game-day-ui-browser
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise off-air loopback RossTalk transport bench
        run: npm run bench:rosstalk
      - name: Upload verified Windows containment helper (component only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-job-host
          path: build/windows/PiRaiders.JobHost.exe
          if-no-files-found: error
          retention-days: 14
      - name: Build portable Windows development bundle
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Verify extracted archive and actual launcher
        if: runner.os == 'Windows'
        run: npm run smoke:windows-package
      - name: Run the extracted ZIP's setup and diagnose entries in source mode (5f-3)
        if: runner.os == 'Windows'
        run: npm run smoke:windows-entries
      - name: Retain setup and diagnose entries evidence (fixed codes only)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-entries-evidence
          path: build/windows-entries-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows development ZIP (not a user-testable release)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: piraiders-windows-development
          path: |
            build/windows/PiRaiders-Development-win-x64.zip
            build/windows/PiRaiders-Development-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  exchange-schema-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned independent test-only schema oracle
        run: 'python -m pip install --only-binary=:all: -r tools/requirements-schema-oracle.txt'
      - name: Compare independent original and rewritten schema decisions
        run: npm run verify:exchange-schema
      - name: Retain sanitized schema comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: exchange-schema-equivalence-${{ github.event_name }}
          path: build/exchange-schema-equivalence/verification.json
          if-no-files-found: error
          retention-days: 14
