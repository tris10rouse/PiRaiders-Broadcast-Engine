name: Full application Windows output proof

on:
  push:
    branches: [master, 'feature/be-007-full-app-proof']
  pull_request:
    paths:
      - '.github/workflows/full-app-proof.yml'
      - 'server.js'
      - 'scripts/**'
      - 'native/**'
      - 'tests/**'
      - 'views/**'
      - 'static/**'
      - 'ASSETS/templates/piraiders/**'
      - 'package*.json'
      - 'packaging/windows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-full-app-private-ndi:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build actual Windows containment and SDK receiver
        run: |
          npm run build:windows-host
          node scripts/build-ndi-probe.cjs
      - name: Prepare pinned Caspar and app-local CI Mesa
        run: node scripts/prepare-caspar-proof.cjs
      - name: Verify and install pinned private CI-only NDI runtime
        run: node scripts/prepare-ndi-proof.cjs
      - name: Install pinned headless browser for actual workstation controls
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Prove actual CLI SPX Game Day and nested native output ownership
        env:
          PIRAIDERS_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/smoke-full-app-windows.cjs
      - name: Retain synthetic received pixels and sanitized application evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-private-ndi-evidence
          path: build/full-app-proof-evidence
          if-no-files-found: warn
          retention-days: 14

  # BE-006 item 5a part 2: a source machine on a synthetic exchange folder,
  # approved, prepared, activated, played and Stopped through the real routes.
  # 5b-4: its stores set up by the setup command, then a cached start with the
  # exchange folder moved away. 5d-2: the app runs in its own console; the
  # online run is closed by Ctrl+C, the cached run by closing the console window.
  # 5d-3: a third start without --no-browser opens Game Day in the runner's
  # default browser; the job finds that browser by its URL, closes it, then
  # closes the app by Ctrl+C.
  actual-exchange-activation-private-ndi:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build actual Windows containment, SDK receiver and CI-only console helper
        run: |
          npm run build:windows-host
          node scripts/build-ndi-probe.cjs
          node scripts/build-console-proof.cjs
      - name: Prepare pinned Caspar and app-local CI Mesa
        run: node scripts/prepare-caspar-proof.cjs
      - name: Verify and install pinned private CI-only NDI runtime
        run: node scripts/prepare-ndi-proof.cjs
      - name: Install pinned headless browser for actual workstation controls
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Prove a synthetic exchange button from setup and approval to Stop, then a cached start without the exchange folder, then a start that opens the default browser, on the actual CLI
        env:
          PIRAIDERS_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/smoke-exchange-activation-windows.cjs
      - name: Check that no retained evidence names the proof folder, exchange folder or a private store
        if: always()
        run: node scripts/proof-evidence-privacy.cjs activation build/exchange-activation-proof-evidence . build/caspar-proof-tools
      - name: Retain synthetic received pixels and sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-activation-private-ndi-evidence
          path: build/exchange-activation-proof-evidence
          if-no-files-found: warn
          retention-days: 14

  actual-extracted-full-app-private-ndi:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build actual Windows containment and SDK receiver
        run: |
          npm run build:windows-host
          node scripts/build-ndi-probe.cjs
      - name: Build genuine committed-source Windows development ZIP
        run: npm run package:windows
      - name: Prepare pinned Caspar and app-local CI Mesa
        run: node scripts/prepare-caspar-proof.cjs
      - name: Verify and install pinned private CI-only NDI runtime
        run: node scripts/prepare-ndi-proof.cjs
      - name: Install pinned headless browser for actual workstation controls
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Prove extracted CMD bundled Node SPX and native NDI output
        id: extracted_output
        env:
          PIRAIDERS_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/smoke-full-app-windows.cjs build/caspar-proof-tools build/windows/PiRaiders-Development-win-x64.zip
      - name: Diagnose ASCII versus Unicode Caspar configuration argv after failed output
        if: ${{ failure() && steps.extracted_output.outcome == 'failure' }}
        env:
          PIRAIDERS_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/probe-caspar-config-path-windows.cjs
      - name: Retain synthetic received pixels and sanitized application evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-full-app-private-ndi-evidence
          path: build/extracted-full-app-proof-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Retain tested development ZIP and checksum (not evaluation release)
        uses: actions/upload-artifact@v4
        with:
          name: extracted-output-tested-development-zip
          path: |
            build/windows/PiRaiders-Development-win-x64.zip
            build/windows/PiRaiders-Development-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
